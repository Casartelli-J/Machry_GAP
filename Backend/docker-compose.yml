services:
  mysql:
    image: mysql:8.4
    container_name: machry_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: machryRoot123
      MYSQL_DATABASE: machry_database
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: machry_phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"

volumes:
  mysql_data:
